<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Harsh Kavathiya | Full Stack Developer & 5x Hackathon Winner</title>

    <!-- 1. Critical App Shell Style (Instant Paint) -->
    <style>
      *,*::before,*::after{box-sizing:border-box}
      :root { --base: #080d1a; --text: #f8fafc; color-scheme: dark; }
      body { margin: 0; background-color: #080d1a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
      #app-shell { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 50%, #0b1628 0%, #060c1a 100%); }
      .shell-logo { width: 60px; height: 60px; opacity: 0.2; animation: shell-pulse 2s ease-in-out infinite; }
      @keyframes shell-pulse { 0%, 100% { opacity: 0.1; transform: scale(0.95); } 50% { opacity: 0.3; transform: scale(1.05); } }
    </style>

    <!-- 2. Primary Handshakes & Discovery -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.github.com" />
    
    <!-- 3. Zero-Chain Font Discovery (Bypasses Fonts API) -->
    <link rel="preload" href="https://fonts.gstatic.com/s/plusjakartasans/v12/LDIbaomQNQcsA88c7O9yZ4KMCoOg4IA6-91aHEjcWuA_qU7NSg.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="https://fonts.gstatic.com/s/plusjakartasans/v12/LDIbaomQNQcsA88c7O9yZ4KMCoOg4IA6-91aHEjcWuA_TknNSg.ttf" as="font" type="font/ttf" crossorigin />

    <style>
      @font-face { font-family: 'Plus Jakarta Sans'; font-style: normal; font-weight: 400; font-display: swap; src: url(https://fonts.gstatic.com/s/plusjakartasans/v12/LDIbaomQNQcsA88c7O9yZ4KMCoOg4IA6-91aHEjcWuA_qU7NSg.ttf) format('truetype'); }
      @font-face { font-family: 'Plus Jakarta Sans'; font-style: normal; font-weight: 700; font-display: swap; src: url(https://fonts.gstatic.com/s/plusjakartasans/v12/LDIbaomQNQcsA88c7O9yZ4KMCoOg4IA6-91aHEjcWuA_TknNSg.ttf) format('truetype'); }
      @font-face { font-family: 'Plus Jakarta Sans'; font-style: normal; font-weight: 800; font-display: swap; src: url(https://fonts.gstatic.com/s/plusjakartasans/v12/LDIbaomQNQcsA88c7O9yZ4KMCoOg4IA6-91aHEjcWuA_KUnNSg.ttf) format('truetype'); }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url(https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuLyfMZg.ttf) format('truetype'); }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 700; font-display: swap; src: url(https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuFuYMZg.ttf) format('truetype'); }
      @font-face { font-family: 'DM Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url(https://fonts.gstatic.com/s/dmmono/v16/aFTU7PB1QTsUX8KYhh0.ttf) format('truetype'); }
      
      *,*::before,*::after{box-sizing:border-box}
      :root { --base: #080d1a; --text: #f8fafc; color-scheme: dark; }
      body { margin: 0; background-color: #080d1a; color: #f8fafc; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow-x: hidden; }
      #app-shell { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 50%, #0b1628 0%, #060c1a 100%); transition: opacity 0.5s ease-out; }
      .shell-logo { width: 60px; height: 60px; opacity: 0.2; animation: shell-pulse 2s ease-in-out infinite; }
      @keyframes shell-pulse { 0%, 100% { opacity: 0.1; transform: scale(0.95); } 50% { opacity: 0.3; transform: scale(1.05); } }
      
      /* Skeleton for First Fold (Hero) */
      .hero-skeleton { position: absolute; top: 50%; left: 5%; transform: translateY(-50%); width: 45%; pointer-events: none; opacity: 0.05; }
      .skEL { height: 20px; background: currentColor; border-radius: 4px; margin-bottom: 12px; }
      .skH { height: 60px; width: 80%; background: currentColor; border-radius: 8px; margin-bottom: 24px; }
    </style>

    <!-- 4. Zero-Blocking CSS Strategy -->
    <link rel="stylesheet" href="/src/index.css" media="print" onload="this.media='all'" fetchpriority="high" />
    <noscript><link rel="stylesheet" href="/src/index.css" /></noscript>
    
    <!-- 5. LCP Image Preload -->
    <link rel="preload" as="image" 
          imagesrcset="https://res.cloudinary.com/dvv5mtpli/image/upload/q_auto,f_auto,w_400/v1776351778/Harsh_Kavathiya_Profile_duaqrs.jpg 400w, https://res.cloudinary.com/dvv5mtpli/image/upload/q_auto,f_auto,w_800/v1776351778/Harsh_Kavathiya_Profile_duaqrs.jpg 800w"
          imagesizes="(max-width: 1024px) 400px, 800px"
          fetchpriority="high" />

    <div id="root">
      <!-- Same gradient + grid as LoadingScreen; branding animates once in React (no duplicate static name). -->
      <div id="app-shell" aria-hidden="true">

        <div class="hero-skeleton">

    </div>
