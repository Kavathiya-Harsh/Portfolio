    <style>
      *,*::before,*::after{box-sizing:border-box}
      :root {
        --base: #080d1a;
        --text: #f8fafc;
        color-scheme: dark;
      }
      body {
        margin: 0;
        background-color: #080d1a;
        color: #f8fafc;
        /* System fonts — zero network cost, instant render */
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      /* ── App Shell: Loading Screen ── */
      #app-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: linear-gradient(150deg, #060c1a 0%, #0b1628 55%, #07101f 100%);
        /* contain:strict here would prevent compositing with React mount — avoid */
      }
      /* 
       * LCP element: rendered from pure HTML+CSS at 0ms.
       * CRITICAL: font-family uses system fonts so this paints BEFORE
       * Google Fonts finish loading. React replaces this with the
       * animated version after JS executes.
       */
      .shell-name {
        display: block;
        line-height: 1.02;
        font-size: clamp(4.5rem, 13vw, 9rem);
        font-weight: 900;
        letter-spacing: -0.03em;
        margin: 0;
        /* System font stack — paints instantly, no network wait */
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        text-align: center;
      }
      .shell-name-first {
        color: #ede9df;
        text-shadow: 0 18px 45px rgba(0,0,0,0.55);
        margin-bottom: -0.06em;
      }
      .shell-name-last {
        background: linear-gradient(135deg, #67e8f9 0%, #38bdf8 28%, #3b82f6 65%, #6366f1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        /* Fallback for browsers that don't support background-clip:text */
        color: #38bdf8;
      }
      .shell-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        user-select: none;
      }
      /* Subtle grid overlay */
      .shell-grid {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.022;
        background-image:
          linear-gradient(rgba(255,255,255,.15) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.15) 1px, transparent 1px);
        background-size: 80px 80px;
      }
    </style>

  <body>
    <div id="root">
      <!--
        App Shell: static HTML that matches the React LoadingScreen exactly.
        The browser paints this INSTANTLY (0ms render delay) before any JS loads.
        React will replace this entire div when it hydrates/mounts.
        The LCP element is the "Harsh" / "Kavathiya" text.
      -->
      <div id="app-shell" aria-hidden="true">
